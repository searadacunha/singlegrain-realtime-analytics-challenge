name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch the official fixture (pinned commit, checksum verified)
        run: python tools/fetch_fixture.py
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Committed reports match a fresh run
        run: |
          python analyze_fixture.py --expect-sha256 1aeb24b415009e89fcf8acb5a178410faf216dc17b16920d9849ecc8bbb24235
          python cost_model.py
          git diff --exit-code
      - name: Official pre-screen of submission.md (pinned commit and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/validate_submission.py" https://raw.githubusercontent.com/ericosiu/beat-claude/4b719e4501c8ff98fd3e641c46d3bffe34b9aaa5/scripts/validate_submission.py
          echo "e90d8df60a67a1944ad6a9b764f1bedab89d2818d95014d5e35f98c4526f0574  $RUNNER_TEMP/validate_submission.py" | sha256sum -c -
          python "$RUNNER_TEMP/validate_submission.py" submission.md --strict
